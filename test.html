<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gnat tracker test</title>
</head>
<body>
  <h1>Gnat tracker test page</h1>
  <p>Open the browser console to see any warnings. Check analytics.db after loading this page.</p>

  <button id="signup-btn">Simulate signup</button>

  <script>
    document.getElementById("signup-btn").addEventListener("click", function () {
      window.gnat.track("signup_completed", { plan: "pro" });
      alert("signup_completed event sent");
    });
  </script>

  <script defer src="http://localhost:8080/tracker.js" data-site-key="dev-secret-change-me"></script>
</body>
</html>
